services:
  backend:
    build:
      context: ./timesheet-Backend
      dockerfile: Dockerfile
    container_name: timesheet-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_URLS=${FRONTEND_URLS:-["http://localhost"]}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3}
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - NEON_BRANCH=${NEON_BRANCH:-production}
      - NEON_AUTH_BASE_URL=${NEON_AUTH_BASE_URL}
      - NEON_AUTH_JWKS_URL=${NEON_AUTH_JWKS_URL}
      - NEON_REALTIME_URL=${NEON_REALTIME_URL}
      - NEON_REALTIME_SECRET=${NEON_REALTIME_SECRET}
      - NEON_FUNCTION_HELLO_BASE_URL=${NEON_FUNCTION_HELLO_BASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - timesheet-network

  frontend:
    build:
      context: ./timesheet-Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: timesheet-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - timesheet-network

networks:
  timesheet-network:
    driver: bridge

volumes:
  backend-uploads:
